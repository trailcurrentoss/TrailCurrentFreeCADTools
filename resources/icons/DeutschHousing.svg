<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Front view of a Deutsch DTM receptacle in its termination housing -->
  <!-- Termination housing -->
  <rect x="3" y="10" width="42" height="34" rx="2" ry="2"
        fill="#52a441" stroke="#2f6a25" stroke-width="1.5"/>
  <!-- Receptacle body -->
  <rect x="9" y="13" width="30" height="28" rx="3" ry="3"
        fill="#5a5a5a" stroke="#333" stroke-width="1.2"/>
  <!-- Latch tab on top -->
  <rect x="18" y="5" width="12" height="9" rx="1.5" ry="1.5"
        fill="#6a6a6a" stroke="#333" stroke-width="1"/>
  <line x1="21" y1="7" x2="27" y2="7" stroke="#888" stroke-width="0.8"/>
  <!-- Pin cavities, 2 x 3 -->
  <circle cx="18" cy="19" r="2.6" fill="#1a1a1a" stroke="#444" stroke-width="0.7"/>
  <circle cx="18" cy="19" r="1.1" fill="#c0c0c0"/>
  <circle cx="30" cy="19" r="2.6" fill="#1a1a1a" stroke="#444" stroke-width="0.7"/>
  <circle cx="30" cy="19" r="1.1" fill="#c0c0c0"/>
  <circle cx="18" cy="27" r="2.6" fill="#1a1a1a" stroke="#444" stroke-width="0.7"/>
  <circle cx="18" cy="27" r="1.1" fill="#c0c0c0"/>
  <circle cx="30" cy="27" r="2.6" fill="#1a1a1a" stroke="#444" stroke-width="0.7"/>
  <circle cx="30" cy="27" r="1.1" fill="#c0c0c0"/>
  <circle cx="18" cy="35" r="2.6" fill="#1a1a1a" stroke="#444" stroke-width="0.7"/>
  <circle cx="18" cy="35" r="1.1" fill="#c0c0c0"/>
  <circle cx="30" cy="35" r="2.6" fill="#1a1a1a" stroke="#444" stroke-width="0.7"/>
  <circle cx="30" cy="35" r="1.1" fill="#c0c0c0"/>
</svg>
